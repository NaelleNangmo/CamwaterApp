global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'camwater-monitor'

# ── Règles d'alertes ──────────────────────────────────────────────────────────
rule_files:
  - /etc/prometheus/alerts/*.yml

# ── Cibles de scraping ────────────────────────────────────────────────────────
scrape_configs:

  # Prometheus lui-même
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Métriques système (CPU, RAM, disque, réseau)
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'camwater-host'

  # Nginx (connexions, requêtes, statuts HTTP)
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx_exporter:9113']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'camwater-nginx'

  # MySQL
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql_exporter:9104']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'camwater-mysql'

  # MongoDB
  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb_exporter:9216']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'camwater-mongodb'
