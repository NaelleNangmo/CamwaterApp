[server]
http_port = 3000
domain = localhost

[security]
# Changer en production !
admin_user = admin
admin_password = camwater_grafana

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/camwater_overview.json

[log]
mode = console
level = warn

[analytics]
reporting_enabled = false
check_for_updates = false
