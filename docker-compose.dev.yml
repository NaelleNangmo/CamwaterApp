services:

  # ── Application Laravel (dev) ──────────────────────────────────────────────
  app:
    build:
      context: .
      target: production
    container_name: camwater_app_dev
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-camwater_dev}
      DB_USERNAME: ${DB_USERNAME:-camwater}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      MONGODB_HOST: mongo
      MONGODB_PORT: 27017
      MONGODB_DATABASE: camwater_logs_dev
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      L5_SWAGGER_GENERATE_ALWAYS: "true"
      L5_SWAGGER_CONST_HOST: http://localhost:8000
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    ports:
      - "8000:80"
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - camwater_network

  # ── MySQL (dev) ────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: camwater_db_dev
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-camwater_dev}
      MYSQL_USER: ${DB_USERNAME:-camwater}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - db_dev_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - camwater_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootsecret"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── MongoDB (dev) ──────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: camwater_mongo_dev
    restart: unless-stopped
    volumes:
      - mongo_dev_data:/data/db
    ports:
      - "27018:27017"
    networks:
      - camwater_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Prometheus (dev) ──────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: camwater_prometheus_dev
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_dev_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - camwater_network
    depends_on:
      - node_exporter
      - nginx_exporter
      - mysql_exporter
      - mongodb_exporter

  # ── Grafana (dev) ──────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: camwater_grafana_dev
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./docker/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_dev_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - camwater_network
    depends_on:
      - prometheus

  # ── Node Exporter (dev) ────────────────────────────────────────────────────
  node_exporter:
    image: prom/node-exporter:v1.7.0
    container_name: camwater_node_exporter_dev
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /:/host:ro,rslave
    networks:
      - camwater_network
    pid: host

  # ── Nginx Exporter (dev) ───────────────────────────────────────────────────
  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: camwater_nginx_exporter_dev
    restart: unless-stopped
    command:
      - '--nginx.scrape-uri=http://app/nginx_status'
    networks:
      - camwater_network
    depends_on:
      - app

  # ── MySQL Exporter (dev) ───────────────────────────────────────────────────
  mysql_exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: camwater_mysql_exporter_dev
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "root:rootsecret@(db:3306)/"
    networks:
      - camwater_network
    depends_on:
      db:
        condition: service_healthy

  # ── MongoDB Exporter (dev) ─────────────────────────────────────────────────
  mongodb_exporter:
    image: percona/mongodb_exporter:0.40
    container_name: camwater_mongodb_exporter_dev
    restart: unless-stopped
    command:
      - '--mongodb.uri=mongodb://mongo:27017'
      - '--collect-all'
    networks:
      - camwater_network
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  db_dev_data:
  mongo_dev_data:
  prometheus_dev_data:
  grafana_dev_data:

networks:
  camwater_network:
    driver: bridge
